<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にゃんこごはん - 子猫の食事・おやつ・カメラ管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #FFF9F5;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen text-amber-950 pb-12">
  <div class="max-w-md mx-auto bg-amber-50/50 min-h-screen shadow-lg relative pb-10">
    <!-- Header -->
    <header class="bg-amber-200/80 backdrop-blur border-b border-amber-300/50 sticky top-0 z-10 px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="bg-amber-400 text-white p-2 rounded-2xl shadow-sm">
          <i class="fa-solid fa-cat text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-amber-900 leading-tight">にゃんこごはん</h1>
          <p class="text-xs text-amber-700">子猫の食事・おやつ・カメラ管理</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openFamilyModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold px-3 py-1.5 rounded-full border border-amber-300 transition">
          <i class="fa-solid fa-users mr-1"></i>家族設定
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4">
      <!-- Selected Date Meal Card -->
      <section class="bg-white rounded-3xl p-4 shadow-sm border border-amber-100 relative overflow-hidden space-y-3">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span id="dateLabelBadge" class="bg-orange-100 text-orange-800 text-xs font-bold px-2.5 py-1 rounded-full border border-orange-200">きょうのごはん</span>
            <button id="todayBackBtn" onclick="selectToday()" class="hidden bg-amber-100 text-amber-900 text-xs font-bold px-2 py-0.5 rounded-full border border-amber-300 hover:bg-amber-200 transition">
              きょうに戻る
            </button>
          </div>
          <span id="currentDateText" class="text-sm font-bold text-amber-800"></span>
        </div>

        <!-- 朝ごはん & 夕ごはん -->
        <div class="grid grid-cols-2 gap-3">
          <!-- 朝ごはん -->
          <div id="morningCard" class="border-2 border-amber-100 bg-amber-50/30 rounded-2xl p-3 flex flex-col justify-between transition-all">
            <div>
              <div class="flex justify-between items-start mb-1">
                <span class="font-bold text-xs text-amber-900 flex items-center gap-1">
                  <i class="fa-solid fa-sun text-amber-500"></i> 朝ごはん
                </span>
                <span id="morningBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500">未入力</span>
              </div>
              <div id="morningDetails" class="text-xs text-amber-700/80 mt-1 space-y-1">
                <p class="italic text-gray-400 text-[11px]">まだです</p>
              </div>
            </div>
            <button id="morningBtn" onclick="openMealModal('朝')" class="mt-3 w-full py-1.5 bg-amber-400 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow-sm transition active:scale-95">
              あげた！
            </button>
          </div>

          <!-- 夕ごはん -->
          <div id="eveningCard" class="border-2 border-amber-100 bg-amber-50/30 rounded-2xl p-3 flex flex-col justify-between transition-all">
            <div>
              <div class="flex justify-between items-start mb-1">
                <span class="font-bold text-xs text-amber-900 flex items-center gap-1">
                  <i class="fa-solid fa-moon text-indigo-400"></i> 夕ごはん
                </span>
                <span id="eveningBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500">未入力</span>
              </div>
              <div id="eveningDetails" class="text-xs text-amber-700/80 mt-1 space-y-1">
                <p class="italic text-gray-400 text-[11px]">まだです</p>
              </div>
            </div>
            <button id="eveningBtn" onclick="openMealModal('夕')" class="mt-3 w-full py-1.5 bg-indigo-400 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-sm transition active:scale-95">
              あげた！
            </button>
          </div>
        </div>

        <!-- おやつ (最大3回) -->
        <div class="border-2 border-pink-100 bg-pink-50/30 rounded-2xl p-3 space-y-2">
          <div class="flex justify-between items-center border-b border-pink-100 pb-1">
            <span class="font-bold text-xs text-amber-900 flex items-center gap-1">
              <i class="fa-solid fa-cookie-bite text-pink-500"></i> おやつ (最大3回)
            </span>
            <span id="snackTotalCount" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-pink-100 text-pink-700">0 / 3回</span>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <!-- おやつ 1 -->
            <div id="snack1Box" class="bg-white rounded-xl p-2 border border-pink-100 flex flex-col justify-between text-center">
              <div class="text-[11px] font-bold text-pink-900 mb-1">1回目</div>
              <div id="snack1Details" class="text-[10px] text-amber-800 my-1">
                <span class="text-gray-400 italic">未入力</span>
              </div>
              <button id="snack1Btn" onclick="openMealModal('おやつ1')" class="py-1 bg-pink-400 hover:bg-pink-500 text-white font-bold rounded-lg text-[10px] transition active:scale-95 mt-1">
                あげた！
              </button>
            </div>

            <!-- おやつ 2 -->
            <div id="snack2Box" class="bg-white rounded-xl p-2 border border-pink-100 flex flex-col justify-between text-center">
              <div class="text-[11px] font-bold text-pink-900 mb-1">2回目</div>
              <div id="snack2Details" class="text-[10px] text-amber-800 my-1">
                <span class="text-gray-400 italic">未入力</span>
              </div>
              <button id="snack2Btn" onclick="openMealModal('おやつ2')" class="py-1 bg-pink-400 hover:bg-pink-500 text-white font-bold rounded-lg text-[10px] transition active:scale-95 mt-1">
                あげた！
              </button>
            </div>

            <!-- おやつ 3 -->
            <div id="snack3Box" class="bg-white rounded-xl p-2 border border-pink-100 flex flex-col justify-between text-center">
              <div class="text-[11px] font-bold text-pink-900 mb-1">3回目</div>
              <div id="snack3Details" class="text-[10px] text-amber-800 my-1">
                <span class="text-gray-400 italic">未入力</span>
              </div>
              <button id="snack3Btn" onclick="openMealModal('おやつ3')" class="py-1 bg-pink-400 hover:bg-pink-500 text-white font-bold rounded-lg text-[10px] transition active:scale-95 mt-1">
                あげた！
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Calendar & History -->
      <section class="bg-white rounded-3xl p-4 shadow-sm border border-amber-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-amber-900 flex items-center gap-1 text-sm">
            <i class="fa-solid fa-calendar-days text-amber-500"></i> きろくカレンダー
          </h2>
          <div class="flex items-center gap-2">
            <button onclick="changeMonth(-1)" class="p-1 text-amber-700 hover:text-amber-900"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="calendarMonthText" class="text-xs font-bold text-amber-800"></span>
            <button onclick="changeMonth(1)" class="p-1 text-amber-700 hover:text-amber-900"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-amber-600 mb-1">
          <div class="text-red-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-xs"></div>
      </section>
    </main>

    <!-- Modal: Meal Entry -->
    <div id="mealModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-3xl p-5 w-full max-w-xs shadow-xl space-y-3 border border-amber-100 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-2 border-amber-100">
          <h3 id="modalTitle" class="font-bold text-amber-900 flex items-center gap-1"></h3>
          <button onclick="closeMealModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-amber-800 mb-1">誰があげましたか？</label>
            <div id="familySelector" class="grid grid-cols-2 gap-2"></div>
          </div>

          <div>
            <label class="block text-xs font-bold text-amber-800 mb-1">時間</label>
            <input type="time" id="mealTimeInput" class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
          </div>

          <div>
            <label class="block text-xs font-bold text-amber-800 mb-1">メモ (任意)</label>
            <input type="text" id="mealNoteInput" placeholder="完食！ちゅーるなど" class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
          </div>

          <!-- カメラ直接起動ボタン (軽量化対策済み) -->
          <div>
            <label class="block text-xs font-bold text-amber-800 mb-1"><i class="fa-solid fa-camera mr-1 text-amber-500"></i> 写真を撮影する (任意)</label>
            <input type="file" id="mealPhotoInput" accept="image/*" capture="environment" onchange="previewImage(event)" class="w-full text-xs text-amber-700 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-400 file:text-white hover:file:bg-amber-500 cursor-pointer">
            <p class="text-[10px] text-gray-400 mt-1">※タップするとそのままカメラが起動します</p>
            
            <div id="photoPreviewContainer" class="mt-2 hidden relative text-center">
              <img id="photoPreview" class="mx-auto h-24 object-cover rounded-xl border border-amber-200 shadow-sm" alt="プレビュー">
              <button type="button" onclick="clearPhoto()" class="absolute top-1 right-1 bg-black/60 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-black/80"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button id="deleteMealBtn" onclick="deleteMealRecord()" class="hidden px-3 py-2 bg-red-100 text-red-600 font-bold rounded-xl text-xs hover:bg-red-200 transition">削除</button>
          <button onclick="saveMealRecord()" class="flex-1 py-2 bg-amber-400 text-white font-bold rounded-xl text-sm hover:bg-amber-500 shadow-sm transition">記録を保存</button>
        </div>
      </div>
    </div>

    <!-- Modal: Family Settings -->
    <div id="familyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-3xl p-5 w-full max-w-xs shadow-xl space-y-4 border border-amber-100">
        <div class="flex justify-between items-center border-b pb-2 border-amber-100">
          <h3 class="font-bold text-amber-900"><i class="fa-solid fa-users text-amber-500 mr-1"></i> 家族メンバー管理</h3>
          <button onclick="closeFamilyModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="space-y-2">
          <p class="text-xs text-amber-700">登録されている家族（最大6人）</p>
          <div id="familyList" class="space-y-1.5"></div>
          <div class="flex gap-2 mt-2">
            <input type="text" id="newMemberInput" placeholder="新しい名前" class="flex-1 bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400">
            <button onclick="addFamilyMember()" class="px-3 py-1.5 bg-amber-400 text-white font-bold rounded-xl text-xs hover:bg-amber-500 transition">追加</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getFormattedDate(d) {
      if (!(d instanceof Date) || isNaN(d)) d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAKo-n_aOMzg78veB7PdRSzUgNbuoqRzIo",
      authDomain: "nyanko-tracker.firebaseapp.com",
      projectId: "nyanko-tracker",
      storageBucket: "nyanko-tracker.firebasestorage.app",
      messagingSenderId: "673935279915",
      appId: "1:673935279915:web:03c94483ae3a7c6a9c1dd4"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const todayDate = new Date();
    let selectedDate = new Date();
    let currentViewDate = new Date();
    let mealsData = {};
    let familyMembers = ["お父さん", "お母さん", "長男", "長女", "次男", "次女"];
    let activeMealType = null;
    let selectedFamilyMember = "";
    let uploadedPhotoData = "";

    window.addEventListener('DOMContentLoaded', () => {
      updateDateDisplay();
      renderCalendar();
      setupFirestoreListener();
    });

    function updateDateDisplay() {
      const yyyy = selectedDate.getFullYear();
      const mm = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const dd = String(selectedDate.getDate()).padStart(2, '0');
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('currentDateText').innerText = `${yyyy}/${mm}/${dd} (${days[selectedDate.getDay()]})`;

      const isToday = getFormattedDate(selectedDate) === getFormattedDate(todayDate);
      const badge = document.getElementById('dateLabelBadge');
      const backBtn = document.getElementById('todayBackBtn');

      if (isToday) {
        badge.innerText = "きょうのごはん";
        badge.className = "bg-orange-100 text-orange-800 text-xs font-bold px-2.5 py-1 rounded-full border border-orange-200";
        backBtn.classList.add('hidden');
      } else {
        badge.innerText = `${mm}/${dd} のごはん`;
        badge.className = "bg-amber-200 text-amber-900 text-xs font-bold px-2.5 py-1 rounded-full border border-amber-300";
        backBtn.classList.remove('hidden');
      }

      updateSelectedDayDisplay();
    }

    function selectToday() {
      selectedDate = new Date(todayDate);
      updateDateDisplay();
      renderCalendar();
    }

    function selectDate(dateStr) {
      const parts = dateStr.split('-');
      selectedDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      updateDateDisplay();
      renderCalendar();
    }

    function setupFirestoreListener() {
      try {
        db.collection('settings').doc('family').onSnapshot(doc => {
          if (doc.exists && doc.data() && doc.data().members) {
            familyMembers = doc.data().members;
          } else {
            db.collection('settings').doc('family').set({ members: familyMembers });
          }
          renderCalendar();
        }, err => console.log('family sync err', err));

        db.collection('meals').onSnapshot(snapshot => {
          mealsData = {};
          snapshot.forEach(doc => {
            mealsData[doc.id] = doc.data();
          });
          updateSelectedDayDisplay();
          renderCalendar();
        }, err => console.log('meals sync err', err));
      } catch (e) {
        console.log('setup error', e);
        renderCalendar();
      }
    }

    function updateSelectedDayDisplay() {
      const selectedKey = getFormattedDate(selectedDate);
      const dayMeals = mealsData[selectedKey] || {};
      
      updateMealCard('morning', dayMeals.morning);
      updateMealCard('evening', dayMeals.evening);

      let snackCount = 0;
      ['snack1', 'snack2', 'snack3'].forEach((snackKey, idx) => {
        const num = idx + 1;
        const data = dayMeals[snackKey];
        const details = document.getElementById(`snack${num}Details`);
        const btn = document.getElementById(`snack${num}Btn`);
        const box = document.getElementById(`snack${num}Box`);

        if (data && data.person) {
          snackCount++;
          details.innerHTML = `
            <div class="font-bold text-pink-900">${data.person} (${data.time \vert{}\vert{} ''})</div>${data.note ? `<div class="text-[9px] italic text-amber-700 truncate">${data.note}</div>` : ''}
            ${data.photo ? `<img src="${data.photo}" class="mt-1 mx-auto h-12 w-full object-cover rounded-lg border border-pink-200">` : ''}
          `;
          btn.innerText = "変更";
          btn.className = "py-1 bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold rounded-lg text-[10px] transition mt-1";
          box.className = "bg-pink-100/50 rounded-xl p-2 border border-pink-300 flex flex-col justify-between text-center";
        } else {
          details.innerHTML = `<span class="text-gray-400 italic">未入力</span>`;
          btn.innerText = "あげた！";
          btn.className = "py-1 bg-pink-400 hover:bg-pink-500 text-white font-bold rounded-lg text-[10px] transition active:scale-95 mt-1";
          box.className = "bg-white rounded-xl p-2 border border-pink-100 flex flex-col justify-between text-center";
        }
      });

      document.getElementById('snackTotalCount').innerText = `${snackCount} / 3回`;
    }

    function updateMealCard(type, data) {
      const badge = document.getElementById(`${type}Badge`);
      const details = document.getElementById(`${type}Details`);
      const btn = document.getElementById(`${type}Btn`);
      const card = document.getElementById(`${type}Card`);

      if (data && data.person) {
        badge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300";
        badge.innerText = "完了";
        details.innerHTML = `
          <p class="font-bold text-amber-900"><i class="fa-solid fa-user mr-1 text-amber-600"></i>${data.person} <span class="text-amber-700/70 text-[11px] font-normal">(${data.time \vert{}\vert{} ''})</span></p>${data.note ? `<p class="italic text-amber-600 bg-amber-100/50 p-1 rounded mt-0.5 text-[11px]">${data.note}</p>` : ''}
          ${data.photo ? `<img src="${data.photo}" class="mt-1 mx-auto h-20 w-full object-cover rounded-xl border border-emerald-200 shadow-sm">` : ''}
        `;
        btn.innerText = "変更・削除";
        btn.className = "mt-3 w-full py-1.5 bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold rounded-xl text-xs transition";
        card.className = "border-2 border-emerald-300 bg-emerald-50/20 rounded-2xl p-3 flex flex-col justify-between transition-all";
      } else {
        badge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500";
        badge.innerText = "未入力";
        details.innerHTML = `<p class="italic text-gray-400 text-[11px]">まだです</p>`;
        
        if (type === 'morning') {
          btn.className = "mt-3 w-full py-1.5 bg-amber-400 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow-sm transition active:scale-95";
        } else {
          btn.className = "mt-3 w-full py-1.5 bg-indigo-400 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-sm transition active:scale-95";
        }
        
        btn.innerText = "あげた！";
        card.className = "border-2 border-amber-100 bg-amber-50/30 rounded-2xl p-3 flex flex-col justify-between transition-all";
      }
    }

    function openMealModal(type) {
      activeMealType = type;
      uploadedPhotoData = "";
      document.getElementById('mealPhotoInput').value = "";
      document.getElementById('photoPreviewContainer').classList.add('hidden');

      let icon = 'fa-sun text-amber-500';
      if (type === '夕') icon = 'fa-moon text-indigo-400';
      if (type.includes('おやつ')) icon = 'fa-cookie-bite text-pink-500';

      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid ${icon} mr-1"></i> ${type}の記録`;

      const selector = document.getElementById('familySelector');
      selector.innerHTML = '';
      selectedFamilyMember = familyMembers[0] || '';

      familyMembers.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `py-1.5 px-2
